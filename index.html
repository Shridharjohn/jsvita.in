/* ============================================================
   JSVITA — Premium Hero (Obsidian & Gold)
   Black/gold typography · serif name · glassmorphism card
   fade-in · premium badge · Contact/Resume buttons
   ============================================================ */

/* ---------- 1. Hero shell & luxury glass card ---------- */
section#top > .mx-auto { position: relative; }

/* modifier: card wraps the hero grid (grid already has its own padding) */
.jsv-hero-card--grid { padding: clamp(10px, 2vw, 20px); border-radius: 30px; }

.jsv-hero-card {
  position: relative;
  border-radius: 28px;
  padding: clamp(28px, 5vw, 56px);
  background: linear-gradient(150deg, rgba(24,18,12,.72) 0%, rgba(13,10,7,.82) 55%, rgba(20,14,9,.78) 100%);
  -webkit-backdrop-filter: blur(18px) saturate(135%);
  backdrop-filter: blur(18px) saturate(135%);
  border: 1px solid rgba(212,175,55,.28);
  box-shadow:
    0 30px 80px -24px rgba(0,0,0,.75),
    inset 0 1px 0 rgba(255,235,190,.10),
    inset 0 -1px 0 rgba(212,175,55,.08);
  overflow: hidden;
  isolation: isolate;
}
.jsv-hero-card::before {
  content: "";
  position: absolute; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(560px 300px at 88% -10%, rgba(212,175,55,.16), transparent 62%),
    radial-gradient(480px 340px at -8% 108%, rgba(255,138,61,.10), transparent 60%);
}
.jsv-hero-card::after {
  content: "";
  position: absolute; top: 0; left: 8%; right: 8%; height: 1px; pointer-events: none;
  background: linear-gradient(90deg, transparent, rgba(240,213,124,.75), transparent);
}

/* ============================================================
   1b. HERO BRAND BLOCK — animated JSVita identity centerpiece
   Logo + letter-by-letter wordmark + tagline. GPU-only motion.
   ============================================================ */
.jsv-brand-block {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  margin-top: 44px;
  isolation: isolate;
}
/* soft spotlight cone behind everything */
.jsv-brand-block::before {
  content: "";
  position: absolute;
  top: -140px;
  left: 50%;
  width: 640px;
  height: 640px;
  transform: translateX(-50%);
  background: radial-gradient(closest-side, rgba(212, 175, 55, 0.14), rgba(212, 175, 55, 0.05) 45%, transparent 72%);
  pointer-events: none;
  z-index: -2;
}

/* ---- logo: large, floating, breathing, wrapped in a dynamic gold aura ---- */
.jsv-brand-logo {
  position: relative;
  width: 128px;
  height: 128px;
  margin-bottom: 26px;
  transform-style: preserve-3d;
  transition: transform 0.5s cubic-bezier(0.22, 1.2, 0.36, 1);
  will-change: transform;
  animation:
    jsvLogoIn 0.9s cubic-bezier(0.22, 1.2, 0.36, 1) 0.05s both,
    jsvBrandFloat 6s ease-in-out 0.95s infinite;
}
.jsv-brand-logo .jv-logo {
  width: 128px;
  height: 128px;
  display: block;
  filter: drop-shadow(0 14px 34px rgba(212, 175, 55, 0.4)) drop-shadow(0 0 22px rgba(247, 215, 116, 0.25));
}
/* dynamic aura: breathes with the logo */
.jsv-brand-logo::before {
  content: "";
  position: absolute;
  inset: -46%;
  border-radius: 50%;
  background: radial-gradient(closest-side, rgba(212, 175, 55, 0.32), rgba(212, 175, 55, 0.1) 52%, transparent 74%);
  z-index: -1;
  animation: jsvAuraPulse 4.2s ease-in-out 1s infinite;
  will-change: opacity, transform;
  pointer-events: none;
}
@keyframes jsvLogoIn {
  from { opacity: 0; transform: scale(0.7); }
  to { opacity: 1; transform: scale(1); }
}
@keyframes jsvBrandFloat {
  0%, 100% { transform: translateY(0) scale(1); }
  50% { transform: translateY(-9px) scale(1.025); }
}
@keyframes jsvAuraPulse {
  0%, 100% { opacity: 0.55; transform: scale(0.96); }
  50% { opacity: 1; transform: scale(1.05); }
}
/* desktop hover: spring tilt (JS-driven transform) + expanded glow */
@media (hover: hover) and (pointer: fine) {
  .jsv-brand-block:hover .jsv-brand-logo::before { opacity: 1.35; }
  .jsv-brand-block:hover .jsv-brand-word { filter: brightness(1.18); }
}
.jsv-brand-word, .jsv-brand-tag { transition: filter 0.45s ease; }

/* ---- JSVita wordmark: gold gradient letters, glass sheen, executive spacing ---- */
.jsv-brand-word {
  position: relative;
  font-family: "Playfair Display", Georgia, serif;
  font-size: clamp(3.4rem, 9vw, 5.6rem);
  font-weight: 800;
  letter-spacing: 0.045em;
  line-height: 1.05;
  display: inline-block;
}
.jsv-brand-ch {
  display: inline-block;
  background: linear-gradient(105deg, #fdf8ec 0%, #f7d774 22%, #d4af37 48%, #f0d57c 66%, #b8860b 88%, #f3e5ab 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  opacity: 0;
  transform: translateY(16px) scale(0.82);

}
@keyframes jsvChIn {
  to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
}
/* glass reflection: slow diagonal sheen gliding over the letters */
.jsv-brand-word::after {
  content: "";
  position: absolute;
  top: -6%;
  bottom: -6%;
  left: -30%;
  width: 34%;
  background: linear-gradient(105deg, transparent, rgba(255, 251, 235, 0.35) 50%, transparent);

}

.jsv-brand-word.jsv-brand-shine::after {
  animation: jsvGlassSheen 0.9s cubic-bezier(0.4, 0, 0.2, 1) 1;
}

/* ---- founder signature: SHRIDHAR JOHN ---- */
.jsv-brand-name {

  font-size: clamp(1.05rem, 2.6vw, 1.5rem);

}

}

}
@keyframes jsvNameFloat {

}
/* hover on desktop: shine + glow intensify */
@media (hover: hover) and (pointer: fine) {

  }
}
/* signature rule flanking the tagline */

}
.jsv-brand-name::after {

  display: block;

  margin: 14px auto 0;

}

}

}

/* ---- mobile touch ripple ---- */
.jsv-brand-rip {

}

}

/* ---------- 6c2. CV attention system (hello / idle shimmer / loading) ---------- */
.jsv-nav-view { position: relative; overflow: hidden; -webkit-backdrop-filter: blur(10px) saturate(140%); backdrop-filter: blur(10px) saturate(140%); }
.jsv-nav-view::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;

}
.jsv-nav-view:hover { color: #f0d57c; box-shadow: 0 0 0 1px rgba(212,175,55,.22), 0 8px 24px -8px rgba(212,175,55,.55), 0 0 16px -4px rgba(247,215,116,.4); }
.jsv-nav-view:hover svg { transform: translateY(-2px); }
.jsv-nav-view svg { transition: transform .3s cubic-bezier(.22,.61,.36,1); }
/* shine sweep helper — fires on .jsv-cv-hello and .jsv-cv-att */
.jsv-cv-hello::after, .jsv-cv-att::after { animation: jsvCvShine 1.1s cubic-bezier(.4,0,.2,1) forwards; }
@keyframes jsvCvShine { to { transform: translateX(140%); } }
/* hello: icon floats up 3px + soft gold pulse ring; button shimmers once */
.jsv-cv-hello svg { animation: jsvCvFloat 1.5s cubic-bezier(.22,.61,.36,1); }
@keyframes jsvCvFloat {
  0%,100% { transform: translateY(0); }
  35% { transform: translateY(-3px); }
  60% { transform: translateY(-1px); }
}
.jsv-cv-hello::before {
  content: ""; position: absolute; inset: -4px; border-radius: 13px; pointer-events: none;
  box-shadow: 0 0 0 0 rgba(247,215,116,.5);
  animation: jsvCvPulse 1.4s ease-out;
}
@keyframes jsvCvPulse {
  0% { box-shadow: 0 0 0 0 rgba(247,215,116,.45); }
  100% { box-shadow: 0 0 0 12px rgba(247,215,116,0); }
}
/* idle attention (every 10s): shimmer + single icon bounce + brief glow rise */
.jsv-cv-att svg { animation: jsvCvBounce 1.3s cubic-bezier(.22,.61,.36,1); }
@keyframes jsvCvBounce {
  0%,100% { transform: translateY(0); }
  30% { transform: translateY(-3px); }
  55% { transform: translateY(0); }
  72% { transform: translateY(-1px); }
}
.jsv-cv-att { transition: box-shadow .5s ease; }
.jsv-cv-att { animation: jsvCvGlow 1.3s ease; }
@keyframes jsvCvGlow {
  0%,100% { box-shadow: inset 0 1px 0 rgba(247,215,116,.1); }
  40% { box-shadow: 0 0 22px -4px rgba(212,175,55,.5), inset 0 1px 0 rgba(247,215,116,.18); }
}
/* hero ghost button shimmer target needs a positioned surface */
a[data-testid="cv-view-btn"] { position: relative; overflow: hidden; }
a[data-testid="cv-view-btn"]::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(110deg, transparent 36%, rgba(255,246,214,.4) 50%, transparent 64%);
  transform: translateX(-140%);
}
a[data-testid="cv-view-btn"].jsv-cv-hello::after, a[data-testid="cv-view-btn"].jsv-cv-att::after { animation: jsvCvShine 1.1s cubic-bezier(.4,0,.2,1) forwards; }
a[data-testid="cv-view-btn"].jsv-cv-hello { animation: jsvBtnGlow 1.4s ease; }
@keyframes jsvBtnGlow {
  0%,100% { box-shadow: 0 0 0 rgba(212,175,55,0); }
  40% { box-shadow: 0 10px 34px -10px rgba(212,175,55,.55); }
}
/* click feedback: icon scale .95, brief gold pulse on the control */
.jsv-cv-loading svg { animation: jsvCvClick .45s cubic-bezier(.22,.61,.36,1); }
@keyframes jsvCvClick { 0%,100% { transform: scale(1); } 40% { transform: scale(.95); } }
.jsv-cv-loading { animation: jsvCvGlow 1.3s ease; }
@media (prefers-reduced-motion: reduce) {
  .jsv-cv-hello, .jsv-cv-att, .jsv-cv-loading { animation: none; }
  .jsv-cv-hello svg, .jsv-cv-att svg, .jsv-cv-loading svg { animation: none; }
  .jsv-cv-hello::after, .jsv-cv-att::after { animation: none; }

  .jsv-nav-signout:hover svg { transform: translateX(4px); }
}
@keyframes jsvSoShine { to { transform: translateX(140%); } }
.jsv-nav-signout:active { transform: scale(.94); }

/* ---------- 12. 3D JSVita sign-out overlay ---------- */
.jsv-3d-overlay {
  position: fixed; inset: 0; z-index: 9998;
  display: none; place-items: center;
  background: rgba(5,5,5,.95);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  perspective: 1100px;
}
.jsv-3d-overlay.show { display: grid; animation: jsv3dFade .4s ease both; }
.jsv-3d-inner { text-align: center; transform-style: preserve-3d; }
.jsv-3d-mono {
  width: 110px; height: 110px; border-radius: 26px; margin: 0 auto;
  background: linear-gradient(135deg, #f7d774, #d4af37 45%, #b8860b);
  display: grid; place-items: center;
  font-family: "JetBrains Mono Variable", monospace; font-weight: 700; font-size: 40px; color: #1a1206;
  box-shadow: 0 24px 70px rgba(212,175,55,.5), inset 0 1px 0 rgba(255,255,255,.4);
  transform-style: preserve-3d;
  animation: jsv3dFlip 1.5s cubic-bezier(.4,0,.2,1) both, goldPulse3d 2s ease-in-out .4s infinite;
}
@keyframes jsv3dFlip {
  0%   { transform: rotateY(0deg) rotateX(0deg) scale(.5); opacity: 0; }
  25%  { opacity: 1; }
  100% { transform: rotateY(720deg) rotateX(12deg) scale(1); opacity: 1; }
}
@keyframes goldPulse3d {
  0%,100% { box-shadow: 0 24px 70px rgba(212,175,55,.45); }
  50%     { box-shadow: 0 24px 90px rgba(247,215,116,.65); }
}
.jsv-3d-word {
  margin-top: 20px;
  font-family: "Playfair Display", Georgia, serif;
  font-size: 30px; font-weight: 800; letter-spacing: .3em; text-transform: uppercase;
  background: linear-gradient(100deg, #fdf8ec, #f4e3b2 30%, #d4af37 58%, #f7d774 78%, #fdf8ec);
  background-size: 200% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: jsv3dRise .7s cubic-bezier(.22,.61,.36,1) .35s both, jsvShimmer 3s ease-in-out infinite;
}
.jsv-3d-sub {
  margin-top: 10px;
  font-family: "JetBrains Mono Variable", monospace; font-size: 10.5px;
  letter-spacing: .3em; text-transform: uppercase; color: #e8d9ae;
  animation: jsv3dRise .7s cubic-bezier(.22,.61,.36,1) .55s both;
}
@keyframes jsv3dFade { from { opacity: 0; } to { opacity: 1; } }
@keyframes jsv3dRise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  .jsv-nav-signout:hover { transform: none; }
  .jsv-3d-mono, .jsv-3d-word, .jsv-3d-sub { animation-duration: .01s !important; animation-iteration-count: 1 !important; }

header { position:fixed !important; top:10px; left:50%; transform:translateX(-50%);
