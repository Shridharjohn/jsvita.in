    if(!window.firebase||!firebase.initializeApp)return;

    document.addEventListener("click", function(e){

      if(b.dataset.mode==="out"){
        e.preventDefault();
        b.innerHTML="Signing out…";
        b.style.pointerEvents="none";

          location.replace("/login.html");

<script>

(function(){

  }

})();
