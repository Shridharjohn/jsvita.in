<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/jsvita-logo.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#000000" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="description" content="JSVita members sign-in." />
  <title>Member Login — JSVita</title>
  <link rel="canonical" href="https://jsvita.in/jsvita/login" />
  <script>if(/\.html$/.test(location.pathname))location.replace(location.pathname.replace(/\.html$/,"")+location.search+location.hash);</script>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://securetoken.googleapis.com; frame-src https://*.firebaseapp.com https://*.firebaseio.com" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root{ --gold:#D4AF37; --glow:#F7D774; --cream:#f7f1e8; --muted:#b3a493; --ease:cubic-bezier(.22,.61,.36,1); }
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%}
    body{
      min-height:100vh; display:grid; place-items:center; padding:24px; overflow:hidden; position:relative;
      background:#000;
      font-family:'DM Sans',system-ui,sans-serif; color:var(--cream);
      -webkit-font-smoothing:antialiased;
    }
    /* ---------- cinematic background ---------- */
    .rays{position:fixed;inset:-20%;z-index:0;pointer-events:none;opacity:.5;
      background:conic-gradient(from 210deg at 50% 38%, transparent 0deg, rgba(212,175,55,.06) 12deg, transparent 24deg, transparent 90deg, rgba(212,175,55,.05) 102deg, transparent 116deg, transparent 200deg, rgba(212,175,55,.06) 214deg, transparent 228deg, transparent 320deg, rgba(212,175,55,.04) 332deg, transparent 345deg);
      animation:jvRays 60s linear infinite; will-change:transform}
    @keyframes jvRays{to{transform:rotate(360deg)}}
    .ambient{position:fixed;inset:0;z-index:0;pointer-events:none;
      background:radial-gradient(620px 460px at 50% 34%, rgba(212,175,55,.12), transparent 68%),
                 radial-gradient(900px 640px at 50% 118%, rgba(184,134,11,.07), transparent 60%);
      animation:jvAmbient 9s ease-in-out infinite}
    @keyframes jvAmbient{0%,100%{opacity:.75}50%{opacity:1}}
    #dust{position:fixed;inset:0;z-index:1;pointer-events:none}
    /* ---------- centerpiece ---------- */
    .stage{position:relative;z-index:3;display:grid;place-items:center;width:min(940px,100%)}
    .mark{position:relative;width:118px;height:118px;margin-bottom:30px;transform-style:preserve-3d;
      animation:jvMarkIn 1s var(--ease) .1s both, jvMarkFloat 6s ease-in-out 1.1s infinite; will-change:transform}
    .mark svg{width:100%;height:100%;display:block;filter:drop-shadow(0 16px 40px rgba(212,175,55,.42)) drop-shadow(0 0 26px rgba(247,215,116,.28))}
    .mark::before{content:"";position:absolute;inset:-52%;border-radius:50%;z-index:-1;
      background:radial-gradient(closest-side, rgba(212,175,55,.3), rgba(212,175,55,.1) 52%, transparent 74%);
      animation:jvBreath 4.4s ease-in-out infinite}
    .mark .ring{position:absolute;border-radius:50%;border:1px solid rgba(212,175,55,.3);pointer-events:none;
      box-shadow:0 0 20px -6px rgba(212,175,55,.25), inset 0 0 16px -8px rgba(247,215,116,.18)}
    .mark .rg1{inset:-34%;animation:jvSpin 24s linear infinite}
    .mark .rg2{inset:-58%;border-color:rgba(212,175,55,.18);border-style:dashed;animation:jvSpin 44s linear infinite reverse}
    .mark .rg3{inset:-84%;border-color:rgba(212,175,55,.1);animation:jvSpin 70s linear infinite}
    @keyframes jvMarkIn{from{opacity:0;transform:scale(.62) translateY(26px);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
    @keyframes jvMarkFloat{0%,100%{transform:translateY(0) rotateY(0)}50%{transform:translateY(-8px) rotateY(9deg)}}
    @keyframes jvBreath{0%,100%{transform:scale(.94);opacity:.7}50%{transform:scale(1.07);opacity:1}}
    @keyframes jvSpin{to{transform:rotate(360deg)}}
    .word{font-family:'Playfair Display',serif;font-weight:800;font-size:clamp(2rem,5vw,2.9rem);letter-spacing:.14em;line-height:1;margin-bottom:34px;
      background:linear-gradient(100deg,#fdf8ec 0%,#f7d774 24%,#d4af37 50%,#f0d57c 68%,#b8860b 86%,#f3e5ab 100%);
      background-size:220% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
      animation:jvWordIn .9s var(--ease) .5s both, jvWordSheen 7s ease-in-out 1.4s infinite; text-align:center}
    @keyframes jvWordIn{from{opacity:0;transform:translateY(14px);letter-spacing:.3em}to{opacity:1;transform:none}}
    @keyframes jvWordSheen{0%,58%,100%{background-position:220% 0}80%{background-position:-60% 0}}
    /* ---------- card ---------- */
    .card{position:relative;width:min(400px,100%);padding:38px 34px 32px;border-radius:24px;
      background:linear-gradient(160deg, rgba(255,255,255,.05), rgba(255,255,255,.015));
      border:1px solid rgba(212,175,55,.32);
      backdrop-filter:blur(22px) saturate(150%); -webkit-backdrop-filter:blur(22px) saturate(150%);
      box-shadow:0 40px 100px -30px rgba(0,0,0,.95), 0 0 60px -22px rgba(212,175,55,.35), inset 0 1px 0 rgba(247,215,116,.12);
      animation:jvCardIn .8s var(--ease) .75s both; transition:transform .45s var(--ease), box-shadow .45s ease, border-color .45s ease;
      will-change:transform}
    @media (hover:hover) and (pointer:fine){
      .card:hover{transform:translateY(-3px);border-color:rgba(212,175,55,.55);
        box-shadow:0 50px 110px -30px rgba(0,0,0,.95), 0 0 80px -22px rgba(212,175,55,.5), inset 0 1px 0 rgba(247,215,116,.16)}
    }
    @keyframes jvCardIn{from{opacity:0;transform:translateY(26px) scale(.94)}to{opacity:1;transform:none}}
    .card::before{content:"";position:absolute;top:0;left:8%;right:8%;height:1px;
      background:linear-gradient(90deg,transparent,rgba(247,215,116,.5),transparent)}
    form{display:none}
    .mode-login form.f-login{display:block}
    .mode-signup form.f-signup{display:block}
    h1{font-family:'Playfair Display',serif;font-size:22px;font-weight:800;text-align:center;letter-spacing:.02em;margin-bottom:6px}
    .sub{text-align:center;font-size:12.5px;color:var(--muted);margin-bottom:24px}
    .field{position:relative;margin-bottom:14px}
    input{width:100%;padding:14px 44px 14px 16px;border-radius:13px;border:1px solid rgba(212,175,55,.3);
      background:rgba(0,0,0,.55);color:var(--cream);font-size:14px;font-family:inherit;outline:none;
      transition:border-color .25s, box-shadow .25s}
    input:focus{border-color:rgba(212,175,55,.8);box-shadow:0 0 0 3px rgba(212,175,55,.16)}
    input::placeholder{color:#7d7264}
    .eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;display:grid;place-items:center;
      background:none;border:none;color:var(--muted);cursor:pointer;border-radius:9px;transition:color .25s}
    .eye:hover{color:var(--glow)}
    .eye svg{width:17px;height:17px}
    .btn{position:relative;overflow:hidden;width:100%;padding:14px;border:none;border-radius:999px;cursor:pointer;
      font-family:inherit;font-size:13.5px;font-weight:700;letter-spacing:.05em;color:#241a05;
      background:linear-gradient(135deg,#f7d774 0%,#d4af37 52%,#c39a20 100%);
      box-shadow:0 12px 30px -10px rgba(212,175,55,.7), inset 0 1px 0 rgba(255,246,214,.65);
      transition:transform .25s var(--ease), filter .25s, box-shadow .25s}
    .btn:hover{transform:translateY(-1px);filter:brightness(1.06)}
    .btn:active{transform:scale(.97)}
    .btn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 34%,rgba(255,251,235,.55) 50%,transparent 66%);
      transform:translateX(-140%);animation:jvBtnShine 5.5s ease-in-out 2s infinite}
    @keyframes jvBtnShine{0%,80%,100%{transform:translateX(-140%)}92%{transform:translateX(140%)}}
    .btn[disabled]{opacity:.65;pointer-events:none}
    .spin{display:none;width:15px;height:15px;border:2px solid rgba(36,26,5,.35);border-top-color:#241a05;border-radius:50%;
      vertical-align:-2px;margin-right:8px;animation:jvSpin .7s linear infinite}
    .btn.busy .spin{display:inline-block}
    .meta{margin-top:16px;text-align:center}
    .meta button{background:none;border:none;color:var(--muted);font-family:inherit;font-size:12px;cursor:pointer;transition:color .25s}
    .meta button:hover{color:var(--glow)}
    .msg{display:none;margin-top:14px;padding:11px 14px;border-radius:12px;font-size:12.5px;line-height:1.5;text-align:center}
    .msg.ok{display:block;background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.35);color:#baf7d0}
    .msg.err{display:block;background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.35);color:#fecaca}
    .ripple{position:absolute;border-radius:50%;pointer-events:none;
      background:radial-gradient(circle, rgba(255,246,214,.55) 0%, rgba(212,175,55,.3) 50%, transparent 70%);
      transform:scale(0);animation:jvRip .6s ease-out forwards}
    @keyframes jvRip{to{transform:scale(2.6);opacity:0}}
    @media (max-width:480px){
      body{padding:16px}
      .mark{width:96px;height:96px;margin-bottom:22px}
      .card{padding:30px 24px 26px}
    }
    @media (prefers-reduced-motion:reduce){
      .rays,.ambient,.mark,.mark::before,.mark svg,.mark .ring,.word,.card,.btn::after{animation:none !important}
      #dust{display:none}
      .mark,.word,.card{opacity:1;transform:none}
    }
  </style>
</head>
<body class="mode-login">
  <div class="rays" aria-hidden="true"></div>
  <div class="ambient" aria-hidden="true"></div>
  <canvas id="dust" aria-hidden="true"></canvas>

  <main class="stage">
    <div class="mark" id="mark" aria-hidden="true">
      <span class="ring rg3"></span><span class="ring rg2"></span><span class="ring rg1"></span>
      <svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" focusable="false"><g transform="translate(120,120)"><polygon points="0,-105 91,-52 91,52 0,105 -91,52 -91,-52" fill="#0A0A0C" stroke="url(#jvOffGrad)" stroke-width="4"/><polygon points="0,-95 83,-46 83,46 0,95 -83,46 -83,-46" fill="none" stroke="url(#jvOffGrad)" stroke-width="1.4" opacity="0.55"/><path d="M -15,-45 L -15,25 C -15,45 0,55 25,45 C 40,38 48,22 48,22" fill="none" stroke="url(#jvOffGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M 28,-38 C 15,-48 -15,-42 -22,-25 C -28,-10 18,-2 12,20 C 6,38 -22,42 -35,30" fill="none" stroke="url(#jvOffGrad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M -50,-20 L 0,65 L 50,-20" fill="none" stroke="url(#jvOffLin)" stroke-width="3" opacity="0.4"/></g></svg>
    </div>
    <h2 class="word">JSVita</h2>

    <div class="card" id="card">
      <form class="f-login" id="fLogin" novalidate>
        <h1>Welcome back</h1>
        <p class="sub">Enter the private members area.</p>
        <div class="field">
          <input id="email" type="email" placeholder="Email" autocomplete="email" required />
        </div>
        <div class="field">
          <input id="pass" type="password" placeholder="Password" autocomplete="current-password" minlength="6" required />
          <button type="button" class="eye" id="eye1" aria-label="Show password" title="Show / hide password">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <button class="btn" id="go" type="submit"><span class="spin"></span><span class="lbl">Sign In</span></button>
        <div class="meta"><button type="button" id="toSignup">New here? Create account</button></div>
      </form>
      <form class="f-signup" id="fSignup" novalidate>
        <h1>Create account</h1>
        <p class="sub">Step inside the members area.</p>
        <div class="field">
          <input id="email2" type="email" placeholder="Email" autocomplete="email" required />
        </div>
        <div class="field">
          <input id="pass2" type="password" placeholder="Password (min 6 characters)" autocomplete="new-password" minlength="6" required />
          <button type="button" class="eye" id="eye2" aria-label="Show password" title="Show / hide password">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <button class="btn" id="go2" type="submit"><span class="spin"></span><span class="lbl">Create Account</span></button>
        <div class="meta"><button type="button" id="toLogin">Already a member? Sign in</button></div>
      </form>
      <div class="msg" id="msg"></div>
    </div>
  </main>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
    <linearGradient id="jvOffGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#F3E5AB"/><stop offset="35%" stop-color="#D4AF37"/><stop offset="70%" stop-color="#AA771C"/><stop offset="100%" stop-color="#F3E5AB"/></linearGradient>
    <linearGradient id="jvOffLin" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#C5A059"/><stop offset="50%" stop-color="#FDF0CD"/><stop offset="100%" stop-color="#C5A059"/></linearGradient>
  </defs></svg>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script>
  (function () {
    "use strict";
    var $ = function (id) { return document.getElementById(id); };
    var body = document.body, msg = $("msg");
    function say(t, ok) { msg.className = "msg " + (ok ? "ok" : "err"); msg.textContent = t; }
    function clear() { msg.className = "msg"; msg.textContent = ""; }
    /* ---------- gold dust: gentle drift, gravitating toward the mark ---------- */
    (function () {
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      var c = $("dust"), ctx = c.getContext("2d"), W, H, ps = [];
      function size() {
        W = c.width = innerWidth; H = c.height = innerHeight;
        ps = [];
        var n = Math.min(60, Math.floor(W * H / 26000));
        for (var i = 0; i < n; i++) ps.push({
          x: Math.random() * W, y: Math.random() * H,
          r: Math.random() * 1.5 + .4,
          vx: (Math.random() - .5) * .12, vy: -(Math.random() * .14 + .03),
          a: Math.random() * .45 + .12, tw: Math.random() * 6.2832
        });
      }
      size(); addEventListener("resize", size, { passive: true });
      (function tick() {
        ctx.clearRect(0, 0, W, H);
        var mx = W / 2, my = H * 0.3;
        for (var i = 0; i < ps.length; i++) {
          var p = ps[i];
          p.tw += .02;
          p.x += (mx - p.x) * 0.0004 + p.vx;
          p.y += (my - p.y) * 0.0004 + p.vy;
          if (p.y < -6) { p.y = H + 6; p.x = Math.random() * W; }
          if (p.x < -6) p.x = W + 6; else if (p.x > W + 6) p.x = -6;
          ctx.beginPath();
          ctx.fillStyle = "rgba(247,215,116," + (p.a * (.6 + .4 * Math.sin(p.tw))).toFixed(3) + ")";
          ctx.arc(p.x, p.y, p.r, 0, 6.2832);
          ctx.fill();
        }
        if (!document.hidden) requestAnimationFrame(tick); else setTimeout(tick, 400);
      })();
    })();
    /* ---------- show / hide password ---------- */
    function wireEye(btnId, inputId) {
      var b = $(btnId), i = $(inputId);
      b.addEventListener("click", function () {
        var show = i.type === "password";
        i.type = show ? "text" : "password";
        b.setAttribute("aria-label", show ? "Hide password" : "Show password");
        b.style.color = show ? "#F7D774" : "";
      });
    }
    wireEye("eye1", "pass"); wireEye("eye2", "pass2");
    /* ---------- mode switch ---------- */
    function mode(m) { body.classList.remove("mode-login", "mode-signup"); body.classList.add(m); clear(); }
    $("toSignup").addEventListener("click", function () { mode("mode-signup"); });
    $("toLogin").addEventListener("click", function () { mode("mode-login"); });
    /* ---------- ripple ---------- */
    document.addEventListener("pointerdown", function (e) {
      var b = e.target.closest(".btn"); if (!b) return;
      var r = b.getBoundingClientRect(), s = Math.max(r.width, r.height);
      var rip = document.createElement("span");
      rip.className = "ripple";
      rip.style.width = rip.style.height = s + "px";
      rip.style.left = (e.clientX - r.left - s / 2) + "px";
      rip.style.top = (e.clientY - r.top - s / 2) + "px";
      b.appendChild(rip);
      setTimeout(function () { rip.remove(); }, 650);
    }, { passive: true });
    /* ---------- Firebase auth ---------- */
    var CFG = { apiKey: "AIzaSyAoEGzAL-WkAGttLArl_PpffJYbOYwc5yE", authDomain: "auth.jsvita.in", projectId: "jsvita-login", storageBucket: "jsvita-login.firebasestorage.app", messagingSenderId: "433927112110", appId: "1:433927112110:web:ad6186be9800780e8d343f" };
    try { if (!firebase.apps.length) firebase.initializeApp(CFG); } catch (e) {}
    var auth = firebase.auth();
    var went = false;
    function enter(path) {
      if (went) return; went = true;
      try { sessionStorage.setItem("jsgateSkip", "1"); } catch (e) {}
      location.replace(path);
    }
    auth.onAuthStateChanged(function (u) { if (u && !went) enter("/dashboard"); });
    function busy(btn, on, label) {
      btn.disabled = on; btn.classList.toggle("busy", on);
      btn.querySelector(".lbl").textContent = on ? "One moment…" : label;
    }
    function friendly(err) {
      var c = String((err && (err.code || err.message)) || "");
      if (c.indexOf("invalid-email") !== -1) return "That email address doesn't look right.";
      if (c.indexOf("wrong-password") !== -1 || c.indexOf("invalid-credential") !== -1) return "Wrong email or password.";
      if (c.indexOf("user-not-found") !== -1) return "No account with that email — create one below.";
      if (c.indexOf("email-already-in-use") !== -1) return "That email already has an account — sign in instead.";
      if (c.indexOf("weak-password") !== -1) return "Password too weak — use at least 6 characters.";
      if (c.indexOf("too-many-requests") !== -1) return "Too many attempts — wait a minute and try again.";
      if (c.indexOf("network") !== -1) return "Network problem — check your connection.";
      return (err && err.message) ? err.message.replace("Firebase:", "").trim() : "Something went wrong.";
    }
    $("fLogin").addEventListener("submit", function (e) {
      e.preventDefault(); clear();
      var email = $("email").value.trim(), pass = $("pass").value;
      if (!email || pass.length < 6) { say("Enter a valid email and a password of at least 6 characters.", false); return; }
      busy($("go"), true, "Sign In");
      auth.signInWithEmailAndPassword(email, pass)
        .then(function () { say("Welcome back.", true); enter("/dashboard"); })
        .catch(function (err) { say(friendly(err), false); busy($("go"), false, "Sign In"); });
    });
    $("fSignup").addEventListener("submit", function (e) {
      e.preventDefault(); clear();
      var email = $("email2").value.trim(), pass = $("pass2").value;
      if (!email || pass.length < 6) { say("Enter a valid email and a password of at least 6 characters.", false); return; }
      busy($("go2"), true, "Create Account");
      auth.createUserWithEmailAndPassword(email, pass)
        .then(function () { enter("/welcome"); })
        .catch(function (err) { say(friendly(err), false); busy($("go2"), false, "Create Account"); });
    });
    if (auth.currentUser) enter("/dashboard");
  })();
  </script>
</body>
</html>
