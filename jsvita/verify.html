<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/jsvita-logo.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#050505" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Verify &amp; Recover — JSVita</title>
  <link rel="canonical" href="https://jsvita.in/jsvita/verify" />
  <script>if(/\.html$/.test(location.pathname))location.replace(location.pathname.replace(/\.html$/,"")+location.search+location.hash);</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root{--gold:#D4AF37;--glow:#F7D774;--deep:#8a6a14;--muted:#b3a493;--good:#4ADE80;--bad:#F87171;--ease:cubic-bezier(.4,0,.2,1)}
    *{margin:0;padding:0;box-sizing:border-box}
    body{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(860px 620px at 50% 26%, #101010 0%, #050505 72%);font-family:'DM Sans',system-ui,sans-serif;color:#f7f1e8}
    .card{width:min(460px,100%);background:rgba(255,255,255,.03);border:1px solid rgba(212,175,55,.25);border-radius:22px;padding:38px 34px;text-align:center;backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);box-shadow:0 30px 80px -30px rgba(0,0,0,.9), inset 0 1px 0 rgba(247,215,116,.08);animation:jvIn .5s var(--ease) both}
    @keyframes jvIn{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
    .mark{width:64px;height:64px;margin:0 auto 18px;animation:jvFloat 3s ease-in-out infinite}
    .mark svg{width:100%;height:100%;display:block;filter:drop-shadow(0 8px 22px rgba(212,175,55,.45))}
    @keyframes jvFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    .eyebrow{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--deep);margin-bottom:8px}
    h1{font-family:'Playfair Display',serif;font-size:24px;font-weight:800;margin-bottom:10px}
    p.lead{font-size:13.5px;line-height:1.6;color:var(--muted);margin-bottom:22px}
    input{width:100%;padding:13px 16px;border-radius:12px;border:1px solid rgba(212,175,55,.3);background:rgba(5,5,5,.6);color:#f7f1e8;font-size:14px;font-family:inherit;outline:none;transition:border-color .25s,box-shadow .25s;margin-bottom:14px}
    input:focus{border-color:rgba(212,175,55,.75);box-shadow:0 0 0 3px rgba(212,175,55,.15)}
    button{width:100%;padding:13px;border:none;border-radius:999px;font-family:inherit;font-size:13px;font-weight:700;letter-spacing:.04em;cursor:pointer;color:#241a05;background:linear-gradient(135deg,#f7d774,#d4af37 55%,#c39a20);box-shadow:0 10px 26px -10px rgba(212,175,55,.65), inset 0 1px 0 rgba(255,246,214,.6);transition:transform .25s var(--ease),box-shadow .25s,filter .25s}
    button:hover{transform:translateY(-1px);filter:brightness(1.06)}
    button:active{transform:scale(.97)}
    button[disabled]{opacity:.6;pointer-events:none}
    .ghost{background:none;border:1px solid rgba(212,175,55,.4);color:#e8d9ae;box-shadow:none;margin-top:10px}
    .msg{display:none;margin-top:16px;padding:11px 14px;border-radius:12px;font-size:12.5px;line-height:1.5}
    .msg.ok{display:block;background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.35);color:#baf7d0}
    .msg.err{display:block;background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.35);color:#fecaca}
    .bar{height:2px;border-radius:2px;margin-top:20px;background:rgba(212,175,55,.15);overflow:hidden;position:relative}
    .bar::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,var(--glow),transparent);animation:jvSweep 1.1s var(--ease) infinite}
    @keyframes jvSweep{to{transform:translateX(100%)}}
    @media (prefers-reduced-motion:reduce){.mark,.bar::after,.card{animation:none}}
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="mark"><svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false"><g transform="translate(120,120)"><polygon points="0,-105 91,-52 91,52 0,105 -91,52 -91,-52" fill="#0A0A0C" stroke="url(#jvOffGrad)" stroke-width="4"/><polygon points="0,-95 83,-46 83,46 0,95 -83,46 -83,-46" fill="none" stroke="url(#jvOffGrad)" stroke-width="1.4" opacity="0.55"/><path d="M -15,-45 L -15,25 C -15,45 0,55 25,45 C 40,38 48,22 48,22" fill="none" stroke="url(#jvOffGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M 28,-38 C 15,-48 -15,-42 -22,-25 C -28,-10 18,-2 12,20 C 6,38 -22,42 -35,30" fill="none" stroke="url(#jvOffGrad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M -50,-20 L 0,65 L 50,-20" fill="none" stroke="url(#jvOffLin)" stroke-width="3" opacity="0.4"/></g></svg></div>
    <p class="eyebrow">JSVita Account Recovery</p>
    <h1 id="title">Verify &amp; Recover</h1>
    <p class="lead" id="lead">Checking your secure link…</p>
    <form id="pwForm" hidden novalidate>
      <input id="pw" type="password" placeholder="New password (min 6 characters)" minlength="6" autocomplete="new-password" required />
      <button id="go" type="submit">Set New Password</button>
    </form>
    <button id="resend" class="ghost" hidden>Resign in to continue</button>
    <div class="msg" id="msg"></div>
    <div class="bar" id="bar" aria-hidden="true"></div>
  </div>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs><linearGradient id="jvOffGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#F3E5AB"/><stop offset="35%" stop-color="#D4AF37"/><stop offset="70%" stop-color="#AA771C"/><stop offset="100%" stop-color="#F3E5AB"/></linearGradient><linearGradient id="jvOffLin" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#C5A059"/><stop offset="50%" stop-color="#FDF0CD"/><stop offset="100%" stop-color="#C5A059"/></linearGradient></defs></svg>
  <script>
  (function () {
    "use strict";
    var $ = function (id) { return document.getElementById(id); };
    var lead = $("lead"), msg = $("msg"), pwForm = $("pwForm"), pw = $("pw"), go = $("go"), bar = $("bar"), title = $("title"), resend = $("resend");
    function say(t, ok) { msg.className = "msg " + (ok ? "ok" : "err"); msg.textContent = t; }
    function busy(on) { go.disabled = on; bar.style.display = on ? "" : "none"; }
    var q = new URLSearchParams(location.search);
    var mode = q.get("mode") || "";
    var oob = q.get("oobCode") || "";
    var API = "https://identitytoolkit.googleapis.com/v1/accounts:";
    var KEY = "AIzaSyAoEGzAL-WkAGttLArl_PpffJYbOYwc5yE";
    function post(action, body) {
      return fetch(API + action + "?key=" + KEY, {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body)
      }).then(function (r) { return r.json().then(function (j) { if (!r.ok) throw j; return j; }); });
    }
    if (mode === "resetPassword" && oob) {
      title.textContent = "Set a New Password";
      lead.textContent = "Choose a strong password for your JSVita account.";
      pwForm.hidden = false;
      pwForm.addEventListener("submit", function (e) {
        e.preventDefault();
        if (!pw.value || pw.value.length < 6) { say("Password must be at least 6 characters.", false); return; }
        busy(true);
        post("resetPassword", { oobCode: oob, newPassword: pw.value })
          .then(function () { say("Password updated. You can sign in now.", true); pwForm.hidden = true; resend.hidden = false; })
          .catch(function (j) { say((j.error && j.error.message ? j.error.message : "Link invalid or expired — request a new one from the sign-in page."), false); })
          .finally(function () { busy(false); });
      });
    } else if (mode === "verifyEmail" && oob) {
      title.textContent = "Email Verification";
      lead.textContent = "Confirming your email address…";
      busy(true);
      post("update", { oobCode: oob })
        .then(function () { say("Email verified. Welcome to JSVita.", true); })
        .catch(function (j) { say((j.error && j.error.message ? j.error.message : "Verification link invalid or already used."), false); })
        .finally(function () { busy(false); setTimeout(function () { location.replace("/jsvita/auth"); }, 1600); });
    } else if (mode === "recoverEmail" && oob) {
      title.textContent = "Recover Email";
      lead.textContent = "Restoring your previous email…";
      busy(true);
      post("update", { oobCode: oob }).then(function () { say("Email restored.", true); }).catch(function () { say("Link invalid or expired.", false); }).finally(function () { busy(false); });
    } else {
      title.textContent = "Secure Link";
      lead.textContent = "This page handles password resets and email verification links. If you need one, start from the sign-in page.";
      resend.hidden = false;
      resend.textContent = "Back to Sign In";
      resend.addEventListener("click", function () { location.replace("/jsvita/login"); });
    }
    resend.addEventListener("click", function () { if (resend.textContent.indexOf("Resign") === 0) location.replace("/jsvita/login"); });
  })();
  </script>
</body>
</html>
