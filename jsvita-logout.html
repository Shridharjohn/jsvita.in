<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/jsvita-logo.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#050505" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Signing Out — JSVita</title>
  <link rel="canonical" href="https://jsvita.in/jsvita/logout" />
  <script>if(/\.html$/.test(location.pathname))location.replace(location.pathname.replace(/\.html$/,"")+location.search+location.hash);</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root{--gold:#D4AF37;--glow:#F7D774;--muted:#b3a493}
    *{margin:0;padding:0;box-sizing:border-box}
    body{min-height:100vh;display:grid;place-items:center;background:radial-gradient(900px 640px at 50% 34%, #101010 0%, #050505 72%);font-family:'DM Sans',system-ui,sans-serif;color:#f7f1e8}
    .wrap{text-align:center;padding:24px}
    .mark{width:84px;height:84px;margin:0 auto 24px;animation:jvOut 1.1s cubic-bezier(.4,0,.2,1) both}
    .mark svg{width:100%;height:100%;display:block;filter:drop-shadow(0 10px 28px rgba(212,175,55,.4))}
    @keyframes jvOut{0%{opacity:0;transform:scale(.9)}30%{opacity:1;transform:scale(1)}100%{opacity:.35;transform:scale(.92)}}
    h1{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;letter-spacing:.05em;background:linear-gradient(105deg,#fdf8ec,#f7d774 45%,#d4af37);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:12px}
    .st{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);animation:jvPulse 1.4s ease-in-out infinite}
    @keyframes jvPulse{0%,100%{opacity:.55}50%{opacity:1}}
    .bar{width:180px;height:2px;border-radius:2px;margin:18px auto 0;background:rgba(212,175,55,.15);overflow:hidden;position:relative}
    .bar::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,var(--glow),transparent);animation:jvSweep 1s cubic-bezier(.4,0,.2,1) infinite}
    @keyframes jvSweep{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
    @media (prefers-reduced-motion:reduce){.mark,.st,.bar::after{animation:none}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="mark"><svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false"><g transform="translate(120,120)"><polygon points="0,-105 91,-52 91,52 0,105 -91,52 -91,-52" fill="#0A0A0C" stroke="url(#jvOffGrad)" stroke-width="4"/><polygon points="0,-95 83,-46 83,46 0,95 -83,46 -83,-46" fill="none" stroke="url(#jvOffGrad)" stroke-width="1.4" opacity="0.55"/><path d="M -15,-45 L -15,25 C -15,45 0,55 25,45 C 40,38 48,22 48,22" fill="none" stroke="url(#jvOffGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M 28,-38 C 15,-48 -15,-42 -22,-25 C -28,-10 18,-2 12,20 C 6,38 -22,42 -35,30" fill="none" stroke="url(#jvOffGrad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M -50,-20 L 0,65 L 50,-20" fill="none" stroke="url(#jvOffLin)" stroke-width="3" opacity="0.4"/></g></svg></div>
    <h1>See you soon</h1>
    <p class="st">Destroying session</p>
    <div class="bar" aria-hidden="true"></div>
  </div>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs><linearGradient id="jvOffGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#F3E5AB"/><stop offset="35%" stop-color="#D4AF37"/><stop offset="70%" stop-color="#AA771C"/><stop offset="100%" stop-color="#F3E5AB"/></linearGradient><linearGradient id="jvOffLin" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#C5A059"/><stop offset="50%" stop-color="#FDF0CD"/><stop offset="100%" stop-color="#C5A059"/></linearGradient></defs></svg>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script>
  (function () {
    "use strict";
    var CFG = { apiKey: "AIzaSyAoEGzAL-WkAGttLArl_PpffJYbOYwc5yE", authDomain: "auth.jsvita.in", projectId: "jsvita-login", storageBucket: "jsvita-login.firebasestorage.app", messagingSenderId: "433927112110", appId: "1:433927112110:web:ad6186be9800780e8d343f" };
    try { if (!firebase.apps.length) firebase.initializeApp(CFG); } catch (e) {}
    var done = false;
    function finish() {
      if (done) return; done = true;
      try {
        /* clear every jsvita-prefixed storage entry (session + local) */
        for (var i = localStorage.length - 1; i >= 0; i--) {
          var k = localStorage.key(i);
          if (/^(firebase:auth|jsvita)/i.test(k)) localStorage.removeItem(k);
        }
        sessionStorage.clear();
      } catch (e) {}
      location.replace("/jsvita/login");
    }
    try { firebase.auth().signOut().then(function () { setTimeout(finish, 900); }).catch(finish); }
    catch (e) { finish(); }
    setTimeout(finish, 3500); /* failsafe */
  })();
  </script>
</body>
</html>
