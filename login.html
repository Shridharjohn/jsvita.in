  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0b0806; --bg2: #14100c; --card: #1c1610; --border: #26201a;
      --cream: #f7f1e8; --muted: #b3a493; --orange: #ff8a3d; --orange-deep: #C2410C;
      --good: #4ADE80; --bad: #F87171;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh; background: var(--bg); color: var(--cream);
      font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column;
    }
    .glow { position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background: radial-gradient(700px 460px at 72% 8%, rgba(255,138,61,.09), transparent 58%), radial-gradient(560px 420px at 8% 100%, rgba(194,65,12,.07), transparent 55%); }
    .panel, input, .tab, .btn { transition: background-color .35s, border-color .35s, color .35s; }
    header { display: flex; justify-content: space-between; align-items: center;
      padding: 18px 28px; border-bottom: 1px solid var(--border); position: relative; z-index: 1; }
    .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--cream); }
    .monogram { width: 38px; height: 38px; border-radius: 10px; background: linear-gradient(135deg, var(--orange), var(--orange-deep));
      display: grid; place-items: center; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 14px; }
    .brand-name { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 20px; }
    .brand-sub { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: .25em; color: var(--muted); }
    .home-link { font-size: 13px; color: var(--muted); text-decoration: none; border: 1px solid var(--border);
      padding: 8px 14px; border-radius: 999px; transition: .2s; }
    .home-link:hover { color: var(--cream); border-color: var(--orange); }
    main { flex: 1; display: grid; place-items: center; padding: 32px 16px; position: relative; z-index: 1; }
    .panel { width: 100%; max-width: 420px; background: var(--bg2); border: 1px solid var(--border);
      border-radius: 24px; padding: 36px 32px; box-shadow: 0 24px 60px rgba(0,0,0,.45); }
    h1 { font-family: 'Playfair Display', serif; font-size: 28px; font-weight: 700; }
    .sub { color: var(--muted); font-size: 14px; margin-top: 6px; }
    .tabs { display: flex; gap: 6px; background: var(--bg); border: 1px solid var(--border);
      border-radius: 12px; padding: 4px; margin: 22px 0; }
    .tab { flex: 1; padding: 9px 0; border: 0; border-radius: 9px; background: transparent; color: var(--muted);
      font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer; transition: .2s; }
    .tab.active { background: var(--orange); color: #fff; }
    label { display: block; font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
      color: var(--muted); margin: 14px 0 6px; }
    input { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--bg); color: var(--cream); font-family: inherit; font-size: 15px; outline: none; transition: .2s; }
    input:focus { border-color: var(--orange); box-shadow: 0 0 0 3px rgba(234,88,12,.15); }
    .btn { width: 100%; margin-top: 18px; padding: 13px; border: 0; border-radius: 12px; cursor: pointer;
      font-family: inherit; font-size: 15px; font-weight: 700; transition: .2s; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .btn-primary { background: var(--orange); color: #fff; }
    .btn-primary:hover { background: var(--orange-deep); box-shadow: 0 8px 24px rgba(234,88,12,.35); }
    .btn-google { background: var(--card); color: var(--cream); border: 1px solid var(--border); }
    .btn-google:hover { border-color: var(--orange); }
    .divider { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 12px; margin: 18px 0 0; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    .msg { margin-top: 14px; padding: 11px 14px; border-radius: 10px; font-size: 14px; display: none; }
    .msg.err { background: rgba(248,113,113,.12); color: var(--bad); border: 1px solid rgba(248,113,113,.3); }
    .msg.ok { background: rgba(74,222,128,.1); color: var(--good); border: 1px solid rgba(74,222,128,.3); }
    .fineprint { margin-top: 18px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--muted); text-align: center; }
    .fineprint a { color: var(--orange); text-decoration: none; }
    .haters { font-size: 11.5px; font-weight: 800; color: var(--orange); letter-spacing: .14em; text-transform: uppercase;
      text-shadow: 0 0 14px rgba(234,88,12,.4); margin-top: 20px; }
    .spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.35); border-top-color: #fff;
      border-radius: 50%; animation: spin .7s linear infinite; display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    /* dashboard */
    #dash { display: none; text-align: center; }
    .avatar { width: 76px; height: 76px; border-radius: 50%; border: 3px solid var(--orange);
      object-fit: cover; margin: 0 auto 16px; display: block; }
    .avatar-fallback { width: 76px; height: 76px; border-radius: 50%; margin: 0 auto 16px;
      background: linear-gradient(135deg, var(--orange), var(--orange-deep)); display: grid; place-items: center;
      font-family: 'Playfair Display', serif; font-size: 30px; font-weight: 700; color: #fff; }
    .badge { display: inline-flex; align-items: center; gap: 6px; font-family: 'JetBrains Mono', monospace;
      font-size: 11px; letter-spacing: .12em; color: var(--good); border: 1px solid rgba(74,222,128,.35);
      background: rgba(74,222,128,.08); border-radius: 999px; padding: 6px 12px; margin-bottom: 14px; }
    .meta { margin-top: 18px; border: 1px solid var(--border); border-radius: 14px; overflow: hidden; text-align: left; }
    .meta-row { display: flex; justify-content: space-between; gap: 12px; padding: 11px 16px; font-size: 14px;
      border-bottom: 1px solid var(--border); }
    .meta-row:last-child { border-bottom: 0; }
    .meta-row .k { color: var(--muted); }
    .meta-row .v { font-family: 'JetBrains Mono', monospace; font-size: 12.5px; text-align: right; word-break: break-all; }
    footer { padding: 18px; text-align: center; font-family: 'JetBrains Mono', monospace;
      font-size: 11px; color: var(--muted); border-top: 1px solid var(--border); position: relative; z-index: 1; }
    footer a:hover { color: var(--orange); border-color: var(--orange); transform: translateY(-2px); }
    /* premium welcome overlay (Apple-style) */
    .welcome-overlay { position: fixed; inset: 0; z-index: 100; display: none; place-items: center;
      background: rgba(11,8,6,.97); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
    .welcome-overlay.show { display: grid; animation: woFade .45s ease both; }
    .welcome-inner { text-align: center; animation: woUp .8s cubic-bezier(.22,.61,.36,1) both; }
    .welcome-mono { width: 64px; height: 64px; border-radius: 18px; margin: 0 auto 18px;
      background: linear-gradient(135deg, #f0d57c, #d4af37 45%, #b8860b); display: grid; place-items: center;
      font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 22px; color: #1a1206;
      box-shadow: 0 18px 50px rgba(212,175,55,.4); animation: woPulse 1.6s ease-in-out infinite; }
    .welcome-name { font-family: 'Playfair Display', serif; font-size: 42px; font-weight: 800;
      background: linear-gradient(100deg, #fdf8ec 0%, #f4e3b2 30%, #d4af37 58%, #f0d57c 78%, #fdf8ec 100%);
      background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
      animation: jswShimmer 2.4s ease-in-out infinite; }
    .welcome-sub { margin-top: 12px; font-family: 'JetBrains Mono', monospace; font-size: 10.5px;
      letter-spacing: .3em; text-transform: uppercase; color: #e8d9ae; }
    @keyframes woFade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes woUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
    @keyframes woPulse { 0%,100% { box-shadow: 0 18px 50px rgba(212,175,55,.35); } 50% { box-shadow: 0 18px 64px rgba(212,175,55,.55); } }
    @keyframes jswShimmer { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
    @media (max-width: 480px) { .welcome-name { font-size: 30px; } }
    @media (max-width: 480px) { .panel { padding: 28px 22px; } h1 { font-size: 24px; } }
  </style>

  <script>
    // ---------- Firebase ----------
    const firebaseConfig = {
      apiKey: "AIzaSyAoEGzAL-WkAGttLArl_PpffJYbOYwc5yE",
      authDomain: "auth.jsvita.in",
      projectId: "jsvita-login",
      storageBucket: "jsvita-login.firebasestorage.app",
      messagingSenderId: "433927112110",
      appId: "1:433927112110:web:ad6186be9800780e8d343f"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    // ---------- helpers ----------
    const $ = id => document.getElementById(id);
    const showMsg = (text, ok) => { const m = $('msg'); m.textContent = text; m.className = 'msg ' + (ok ? 'ok' : 'err'); m.style.display = 'block'; };
    const hideMsg = () => { $('msg').style.display = 'none'; };
    const busy = on => { $('spin').style.display = on ? 'inline-block' : 'none'; $('submitBtn').disabled = on; $('googleBtn').disabled = on; };

    // Email notify via FormSubmit (already activated for jsvita.in form)
    function notifyAdmin(subject, fields) {
      try {
        fetch('https://formsubmit.co/ajax/admin@jsvita.in', {
          method: 'POST', keepalive: true,
          headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
          body: JSON.stringify(Object.assign({
            _subject: subject, _template: 'table', _captcha: 'false'
          }, fields))
        }).catch(() => { try { navigator.sendBeacon('https://formsubmit.co/ajax/admin@jsvita.in', new Blob([JSON.stringify(Object.assign({ _subject: subject, _template: 'table', _captcha: 'false' }, fields))], { type: 'application/json' })); } catch (e) {} });
      } catch (e) {}
    }

    function fmt(d) {
      return d ? new Date(d).toLocaleString('en-IN', { dateStyle: 'medium', timeStyle: 'short' }) : '—';
    }

    // ---------- tabs ----------
    let mode = 'login';
    function setMode(m) {
      mode = m; hideMsg();
      $('tabLogin').classList.toggle('active', m === 'login');
      $('tabSignup').classList.toggle('active', m === 'signup');
      $('title').textContent = m === 'login' ? 'Welcome back' : 'Join JSVita';
      $('subtitle').textContent = m === 'login' ? 'Sign in to your JSVita members area.' : 'Create your free members account in seconds.';
      $('submitLabel').textContent = m === 'login' ? 'Sign in' : 'Create my account';
      $('pass').setAttribute('autocomplete', m === 'login' ? 'current-password' : 'new-password');
    }
    $('tabLogin').onclick = () => setMode('login');
    $('tabSignup').onclick = () => setMode('signup');

    // ---------- email/password ----------
    $('authForm').addEventListener('submit', async e => {
      e.preventDefault(); hideMsg();
      const email = $('email').value.trim(), pass = $('pass').value;
      if (!email || pass.length < 6) { showMsg('Enter a valid email and a password of at least 6 characters.'); return; }
      busy(true);
      try {
        if (mode === 'signup') {
          const cred = await auth.createUserWithEmailAndPassword(email, pass);
          notifyAdmin('[jsvita.in] New member signup — ' + email, {
            Name: cred.user.displayName || '(not set)', Email: email,
            Provider: 'Email/Password', 'Member since': fmt(cred.user.metadata.creationTime)
          });
        } else {
          await auth.signInWithEmailAndPassword(email, pass);
          notifyAdmin('[jsvita.in] Member login — ' + email, {
            Email: email, Provider: 'Email/Password', When: fmt(new Date().toISOString())
          });
        }
      } catch (err) {
        showMsg(friendly(err)); busy(false);
      }
    });

    // ---------- google (popup first, redirect fallback — covers all browsers) ----------
    $('googleBtn').onclick = async () => {
      hideMsg();
      $('googleBtn').disabled = true; $('submitBtn').disabled = true;
      $('googleLabel').textContent = 'Opening Google…';
      const provider = new firebase.auth.GoogleAuthProvider();
      provider.setCustomParameters({ prompt: 'select_account' });
      const finish = cred => {
        const isNew = cred.additionalUserInfo && cred.additionalUserInfo.isNewUser;
        notifyAdmin(
          isNew ? '[jsvita.in] New member signup (Google) — ' + cred.user.email
                : '[jsvita.in] Member login (Google) — ' + cred.user.email,
          { Name: cred.user.displayName || '(not set)', Email: cred.user.email,
            Provider: 'Google', When: fmt(new Date().toISOString()) }
        );
      };
      try {
        const cred = await auth.signInWithPopup(provider);
        if (cred.user) finish(cred); // dashboard + redirect handled by onAuthStateChanged
      } catch (err) {
        const c = err.code || '';
        if (c === 'auth/popup-blocked' || c === 'auth/operation-not-supported-in-this-environment' || c === 'auth/popup-failed-to-open') {
          // Browser refused the popup — use full-page redirect instead
          try { await auth.signInWithRedirect(provider); return; } catch (e2) { showMsg(friendly(e2)); }
        } else if (c !== 'auth/popup-closed-by-user' && c !== 'auth/cancelled-popup-request') {
          showMsg(friendly(err));
        }
        $('googleBtn').disabled = false; $('submitBtn').disabled = false;
        $('googleLabel').textContent = 'Continue with Google';
      }
    };

    // Handle the return trip if the redirect path was used
    auth.getRedirectResult().then(result => {
      if (result.user) {
        const isNew = result.additionalUserInfo && result.additionalUserInfo.isNewUser;
        notifyAdmin(
          isNew ? '[jsvita.in] New member signup (Google) — ' + result.user.email
                : '[jsvita.in] Member login (Google) — ' + result.user.email,
          { Name: result.user.displayName || '(not set)', Email: result.user.email,
            Provider: 'Google', When: fmt(new Date().toISOString()) }
        );
      }
    }).catch(err => { if (err.code) showMsg(friendly(err)); });

    // ---------- forgot password ----------
    $('forgotLink').onclick = e => {
      e.preventDefault(); hideMsg();
      const email = $('email').value.trim();
      if (!email) { showMsg('Type your email above first, then press "Forgot password?".'); return; }
      auth.sendPasswordResetEmail(email).then(() => {
        showMsg('Password reset email sent to ' + email + ' — check your inbox (and spam).', true);
      }).catch(err => showMsg(friendly(err)));
    };

    function friendly(err) {
      const c = err.code || '';
      if (c.includes('invalid-email')) return 'That email address doesn\'t look right.';
      if (c.includes('wrong-password') || c.includes('invalid-credential')) return 'Wrong email or password.';
      if (c.includes('user-not-found')) return 'No account with that email — switch to "Create account".';
      if (c.includes('email-already-in-use')) return 'That email already has an account — switch to "Sign in".';
      if (c.includes('weak-password')) return 'Password too weak — use at least 6 characters.';
      if (c.includes('too-many-requests')) return 'Too many attempts — wait a minute and try again.';
      if (c.includes('network')) return 'Network problem — check your connection.';
      return err.message || 'Something went wrong.';
    }

    // ---------- redirect to website (premium welcome, no popups) ----------
    let went = false;
    auth.onAuthStateChanged(user => {
      busy(false);
      if (!user) { $('authPanel').style.display = 'block'; $('dash').style.display = 'none'; return; }
      if (went) return;
      went = true;
      $('authPanel').style.display = 'none';
      var ov = document.getElementById('welcomeOverlay');
      if (ov) ov.classList.add('show');
      setTimeout(() => window.location.replace('https://jsvita.in/'), 1400);
    });

    $('logoutBtn').onclick = () => auth.signOut();
  </script>
</body>
</html>
